  const cp=proj(cam.x,cam.y);
  ctx.save();
  ctx.translate(W/2+cam.sx,H/2+cam.sy);ctx.scale(cam.z,cam.z);ctx.translate(-cp[0],-cp[1]);
  ctx.drawImage(groundCv,-groundCv.OX,-groundCv.M);
  dlN=0;
  for(const n of nodes)dlPush(n.x+n.y,0,n);
  for(const b of builds)dlPush(b.x+b.y,1,b);
  dlPush(core.x+core.y,2,null);
  for(const f of foes)if(!f.dead)dlPush(f.x+f.y,3,f);
  for(const p of picks)dlPush(p.x+p.y,4,p);
  if(!P.downed)dlPush(P.x+P.y,5,null);
  for(const g of ghosts)dlPush(g.x+g.y,6,g);
  for(const w of warns)dlPush(w.x+w.y,7,w);
  dlActive.length=dlN;for(let i=0;i<dlN;i++)dlActive[i]=dlPool[i];
  dlActive.sort((a,b)=>a.d-b.d);
  for(let i=0;i<dlN;i++){
    const it=dlActive[i];
    switch(it.k){
      case 0:{const n=it.o;n.type==='tree'?drawTree(n):n.type==='rock'?drawRock(n):drawCrys(n);break;}
      case 1:drawBuild(it.o);break;
      case 2:drawCore();break;
      case 3:drawFoe(it.o);break;
      case 4:drawPickup(it.o);break;
      case 5:drawPlayer();break;
      case 6:{const g=it.o,p=proj(g.x,g.y);ctx.globalAlpha=.3*(1-g.t/.3);ctx.fillStyle='#8fe3d0';
        ctx.beginPath();ctx.ellipse(p[0],p[1]-15,9,16,0,0,TAU);ctx.fill();ctx.globalAlpha=1;break;}
      case 7:{
        const w=it.o,p=proj(w.x,w.y),t=1-w.t/(w.boss?1.6:.95);
        ctx.strokeStyle=w.boss?'rgba(255,77,109,.8)':'rgba(160,107,255,.7)';ctx.lineWidth=2.5;
        for(let i=0;i<3;i++){ctx.beginPath();
          ctx.ellipse(p[0],p[1],(14+i*8)*(1-t*.3),(7+i*4)*(1-t*.3),S.elapsed*3+i*2,0,Math.PI*1.4);ctx.stroke();}
        ctx.fillStyle=`rgba(160,107,255,${.25+.2*Math.sin(S.elapsed*10)})`;
        ctx.beginPath();ctx.ellipse(p[0],p[1],18,9,0,0,TAU);ctx.fill();break;}
    }
  }
  drawGhost();
  for(const s of slashes){
    const t=s.t/.18,c0=proj(s.x,s.y);
    ctx.globalAlpha=(1-t)*.8;
    const g=ctx.createRadialGradient(c0[0],c0[1],4,c0[0],c0[1],Math.max(6,s.R*TW/2));
    g.addColorStop(0,'rgba(255,220,160,0)');g.addColorStop(.7,'rgba(255,200,120,.5)');g.addColorStop(1,'rgba(255,180,84,.9)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(c0[0],c0[1]-10);
    for(let i=0;i<=10;i++){const a=s.ang-1.1+i/10*2.2,p=proj(s.x+Math.cos(a)*s.R,s.y+Math.sin(a)*s.R);ctx.lineTo(p[0],p[1]-10);}
    ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  }
  for(const s of shots){
    const p=proj(s.x,s.y),px=p[0],py=p[1],z=s.z||10;
    if(s.type==='arrow'){
      const sp=proj(s.vx,s.vy),m=Math.hypot(sp[0],sp[1])||1;
      ctx.strokeStyle='#e8d9b0';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px-sp[0]/m*7,py-z-sp[1]/m*7);ctx.lineTo(px+sp[0]/m*7,py-z+sp[1]/m*7);ctx.stroke();
    }else if(s.type==='cannon'){ctx.drawImage(GLOW.cyan,px-10,py-z-10,20,20);
      ctx.fillStyle='#dffaff';ctx.beginPath();ctx.arc(px,py-z,3,0,TAU);ctx.fill();}
    else if(s.type==='fog'){ctx.drawImage(GLOW.violet,px-9,py-21,18,18);
      ctx.fillStyle='#e0ccff';ctx.beginPath();ctx.arc(px,py-12,2.6,0,TAU);ctx.fill();}
    else{const sp=proj(s.vx,s.vy),m=Math.hypot(sp[0],sp[1])||1;
      ctx.strokeStyle='rgba(143,227,208,.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(px-sp[1]/m*12,py-12+sp[0]/m*6);ctx.lineTo(px+sp[1]/m*12,py-12-sp[0]/m*6);ctx.stroke();}
  }
  for(const p of parts){
    const pr=proj(p.x,p.y),px=pr[0],py=pr[1],t=p.life/p.max;
    if(p.ring){
      const r=lerp(p.r1,p.r0,t);
      ctx.strokeStyle=p.col;ctx.globalAlpha=t;ctx.lineWidth=3*t+1;
      ctx.beginPath();ctx.ellipse(px,py,r*TW/2*1.2,r*TH/2*1.2,0,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    }else{ctx.globalAlpha=t;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(px,py-p.z,p.size*t+.5,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  }
  ctx.textAlign='center';
  for(const f of floats){
    const p=proj(f.x,f.y),t=f.life/.9;
    ctx.globalAlpha=Math.min(1,t*2);
    ctx.font=(f.big?'900 17px':'700 13px')+' "Noto Sans SC",sans-serif';
    ctx.strokeStyle='rgba(5,10,16,.9)';ctx.lineWidth=3;
    ctx.strokeText(f.txt,p[0],p[1]-34-(1-t)*22);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,p[0],p[1]-34-(1-t)*22);ctx.globalAlpha=1;
  }
  ctx.restore();
  const night=S.mode==='menu'?.55:S.nightAmt;
  if(night>0.02){
    ctx.fillStyle=`rgba(5,9,22,${.52*night})`;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const light=(x,y,r,img,a)=>{
      const p=proj(x,y),sx=(p[0]-cp[0])*cam.z+W/2+cam.sx,sy=(p[1]-cp[1])*cam.z+H/2+cam.sy,rr=r*cam.z;
      if(rr<2||sx<-rr||sy<-rr||sx>W+rr||sy>H+rr)return;
      ctx.globalAlpha=clamp(a*night,0,1);ctx.drawImage(img,sx-rr,sy-rr,rr*2,rr*2);
    };
    light(core.x,core.y,260,GLOW.amber,.5);
    if(!P.downed)light(P.x,P.y,160,GLOW.lantern,.45);
    for(const b of builds){
      if(b.type==='tower')light(b.x,b.y,70,GLOW.mint,.3);
      else if(b.type==='cannon')light(b.x,b.y,90,GLOW.cyan,.35);
      else if(b.type==='totem')light(b.x,b.y,90,GLOW.leaf,.3);
    }
    for(const n of nodes)if(n.alive&&n.type==='crys')light(n.x,n.y,60,GLOW.cyan,.3);
    for(const s of shots)if(s.type==='cannon'||s.type==='fog')light(s.x,s.y,40,s.type==='cannon'?GLOW.cyan:GLOW.violet,.35);
    ctx.globalAlpha=1;
    const cpr=proj(core.x,core.y),cpx=(cpr[0]-cp[0])*cam.z+W/2+cam.sx,cpy=(cpr[1]-cp[1])*cam.z+H/2+cam.sy;
    const beamA=(S.mode==='launch'?Math.min(1,S.launchT/1.2):core.beam*.35)*night;
    if(beamA>0.02){
      const bw=(S.mode==='launch'?20+S.launchT*60:12)*cam.z;
      const g=ctx.createLinearGradient(cpx,cpy-90*cam.z,cpx,cpy-90*cam.z-320*cam.z);
      g.addColorStop(0,`rgba(255,200,120,${beamA})`);g.addColorStop(1,'rgba(255,200,120,0)');
      ctx.fillStyle=g;ctx.fillRect(cpx-bw/2,cpy-90*cam.z-320*cam.z,bw,320*cam.z);
    }
    ctx.globalCompositeOperation='source-over';
  }else{ctx.fillStyle='rgba(255,190,120,.05)';ctx.fillRect(0,0,W,H);}
  for(const f of fogBlobs){
    const sx=W/2+f.x-cp[0]*.12,sy=H/2+f.y-cp[1]*.12+Math.sin(S.elapsed*.3+f.ph)*14;
    ctx.globalAlpha=clamp(f.a*(1+night*.8),0,1);ctx.drawImage(GLOW.fog,sx-f.s,sy-f.s,f.s*2,f.s*2);
  }
  ctx.globalAlpha=1;ctx.fillStyle=vigGrad;ctx.fillRect(0,0,W,H);
  if(S.mode==='launch'&&S.launchT>1.6){ctx.fillStyle=`rgba(255,240,214,${Math.min(1,(S.launchT-1.6)/1)})`;ctx.fillRect(0,0,W,H);}
  renderMinimap();
}
function renderMinimap(){
  mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,124,124);
  mctx.drawImage(mmMask,0,0,124,124);
  const k=124/GRID;
  const dot=(x,y,r,col)=>{mctx.fillStyle=col;mctx.beginPath();mctx.arc(x*k,y*k,r,0,TAU);mctx.fill();};
  for(const b of builds)dot(b.x,b.y,1.6,'#57e6ff');
  if(Math.floor(S.elapsed*6)%2===0)for(const w of warns)dot(w.x,w.y,2.5,'#a06bff');
  for(const f of foes)if(!f.dead)dot(f.x,f.y,f.boss?3.5:1.6,f.boss?'#ff4d6d':'#ff7a90');
  dot(core.x,core.y,3+Math.sin(S.elapsed*3)*.7,'#ffb454');
  if(!P.downed){
    dot(P.x,P.y,2.4,'#ffffff');
    mctx.strokeStyle='rgba(255,255,255,.6)';mctx.lineWidth=1;
    mctx.beginPath();mctx.moveTo(P.x*k,P.y*k);mctx.lineTo(P.x*k+Math.cos(P.face)*5,P.y*k+Math.sin(P.face)*5);mctx.stroke();
  }
}

function setTxt(el,v){if(el&&el._t!==v){el._t=v;el.textContent=v;}}
function setBar(el,fill,r){const v=clamp(r,0,1).toFixed(3);if(el._v!==v){el._v=v;fill.style.transform=`scaleX(${v})`;}}
function syncHUD(){
  if(S.mode==='menu')return;
  const night=S.phase==='night';
  if(UI.phaseChip._n!==night){
    UI.phaseChip._n=night;UI.phaseChip.classList.toggle('night',night);
    UI.phaseIcon.innerHTML=ICONS[night?'moon':'sun'];UI.phaseBar.classList.toggle('night',night);
    setTxt(UI.phaseName,night?'雾潮':'白昼');
  }
  setTxt(UI.dayLabel,night?`第 ${S.day} 夜`:`第 ${S.day} 日`);
  setTxt(UI.nightLabel,`夜 ${S.stats.nights}/7`);
  setBar(UI.phaseBar,UI.phaseBar,night?(S.nightTotal?S.nightKilled/S.nightTotal:0):S.timeLeft/DAY_LEN);
  setBar(UI.hpBar,UI.hpFill,P.hp/P.maxHp);
  const low=P.hp/P.maxHp<.3;
  if(UI.hpBar._low!==low){UI.hpBar._low=low;UI.hpBar.classList.toggle('low',low);}
  setTxt(UI.hpTxt,`${Math.ceil(P.hp)}/${P.maxHp}`);
  setBar(UI.enBar,UI.enFill,P.en/P.maxEn);setTxt(UI.enTxt,Math.floor(P.en));
  setBar(UI.xpBar,UI.xpFill,P.xp/P.next);setTxt(UI.lvl,P.lvl);
  setBar(UI.dashPip,UI.dashFill,1-P.dashCd/P.dashCdMax);
  const dr=P.dashCd<=0;if(UI.dashPip._r!==dr){UI.dashPip._r=dr;UI.dashPip.classList.toggle('ready',dr);}
  setBar(UI.novaPip,UI.novaFill,P.en/60);
  const nr=P.en>=60;if(UI.novaPip._r!==nr){UI.novaPip._r=nr;UI.novaPip.classList.toggle('ready',nr);}
  setBar(UI.coreBar,UI.coreFill,core.hp/core.max);
  setTxt(UI.coreTxt,`${Math.ceil(core.hp)}/${core.max}`);
  const crit=core.hp/core.max<.3;
  if(UI.coreWrap._c!==crit){UI.coreWrap._c=crit;UI.coreWrap.classList.toggle('crit',crit);}
  UI.coreFx.style.opacity=crit?(.5+.3*Math.sin(S.elapsed*4)).toFixed(2):0;
  const nc=!P.downed&&dist(P.x,P.y,core.x,core.y)<2.8&&core.hp<core.max;
  if(UI.repair._s!==nc){UI.repair._s=nc;UI.repair.classList.toggle('show',nc);}
  syncHand(false);
}
function refreshRes(bump){
  const row=$('resRow');
  if(!row.children.length){
    row.innerHTML=['wood','stone','crys'].map(k=>
      `<span class="resChip" id="res_${k}" style="color:${RESCOL[k]}">${svg(k==='crys'?'crys':k,13)}<b id="resN_${k}">0</b></span>`).join('');
    UI.resN={wood:$('resN_wood'),stone:$('resN_stone'),crys:$('resN_crys')};
    UI.resChip={wood:$('res_wood'),stone:$('res_stone'),crys:$('res_crys')};
  }
  for(const k of ['wood','stone','crys']){
    setTxt(UI.resN[k],res[k]);
    if(bump===k){const el=UI.resChip[k];el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  }
}
function toast(msg,cls=''){
  const wrap=UI.toasts;
  while(wrap.children.length>=2)wrap.removeChild(wrap.firstChild);
  const el=document.createElement('div');el.className='toast '+cls;el.textContent=msg;
  wrap.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove();},2600);
}
let bannerTimer=null;
function banner(title,sub,cls){
  const el=UI.banner;el.className=cls||'';
  UI.bannerH.textContent=title;UI.bannerP.textContent=sub||'';
  void el.offsetWidth;el.classList.add('show');
  clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>el.classList.remove('show'),2700);
}

   stats:()=>[['基础生命',FOES.boss.hp],['本局生命',foeNow('boss')],['践踏伤害','25'],

    rel:['dawn','keeper','hand']})),
  ...Object.entries(BLESS).map(([k,b])=>({id:'l_'+k,cat:'legacy',name:b.name+'传承',icon:b.icon,color:b.color,
    desc:b.desc+'。用文明火种在标题界面永久解锁，跨局生效。',
    stats:()=>[['当前等级',save.bless[k]+' / '+b.max],
      ['下级花费',save.bless[k]>=b.max?'已满级':b.costs[save.bless[k]]+' 火种'],['火种库存',save.embers]],
    rel:['ember','keeper']})),
  {id:'hand',cat:'term',name:'手牌与上限',icon:'cards',color:'#ffb454',
   desc:'初始上限 5 张。打出扩容牌 +1，最高 10；到顶后扩容牌从牌库与奖励池永久退场。夜晚保留手牌。',
   stats:()=>[['当前手牌',DECK.hand.length],['当前上限',DECK.max],['上限天花板',HAND_CAP],
     ['扩容存世',cardTotal('expand')+' 张']],rel:['c_expand','dawn','deck']},
  {id:'deck',cat:'term',name:'牌库循环',icon:'cards',color:'#8fe3d0',
   desc:'抽牌堆 → 手牌 → 弃牌堆 → 洗牌回到抽牌堆。建筑留场，卡牌回库，所以同一张箭塔可以反复部署。',
   stats:()=>[['抽牌堆',DECK.draw.length],['手牌',DECK.hand.length],['弃牌堆',DECK.discard.length],
     ['总张数',DECK.draw.length+DECK.hand.length+DECK.discard.length],['本局出牌',S.stats?S.stats.played:0]],
   rel:['dawn','c_tactic','hand']},
  {id:'recycle',cat:'term',name:'回收率',icon:'salvage',color:'#6fe08a',
   desc:'拆解牌分 5% / 10% / 20% 三档，累加至最高 80%。移除一张牌时按当前回收率返还其造价，向下取整。到顶后拆解牌退场。',
   stats:()=>[['当前回收率',DECK.recycle+'%'],['上限',REC_CAP+'%'],
     ['拆解存世',cardTotal('salvage5')+cardTotal('salvage10')+cardTotal('salvage20')+' 张']],
   rel:['c_salvage5','c_salvage10','c_salvage20']},
  {id:'dawn',cat:'term',name:'黎明回合',icon:'sun',color:'#ffb454',
   desc:'每次天亮进入两步选择：先 3 选 1 拾获卡牌，再 3 选 1 获得祝福，都可跳过；随后抽满手牌。',
   stats:()=>[['白昼时长',DAY_LEN+' 秒'],['当前日数',S.day],['额外抽牌',P.bonusDraw+' 张'],
     ['核心自愈','1 /秒']],rel:['hand','deck','b_blade']},
  {id:'tide',cat:'term',name:'雾潮',icon:'fog',color:'#a06bff',
   desc:'夜间敌潮，自岛缘分批刷新。夜晚构筑牌封存，只能打瞬发牌——白天没铺好，晚上就得靠操作。',
   stats:()=>[['本夜波次',S.nightTotal||'—'],['已消灭',S.nightKilled],['同屏上限','42'],['每夜成长','+13% 生命']],
   rel:['seven','c_rain','c_mine']},
  {id:'seven',cat:'term',name:'七夜',icon:'clock',color:'#8fe3d0',
   desc:'一次远航的长度。撑过第七夜并击溃雾潮之主，方舟启航即胜利。',
   stats:()=>[['总夜数',MAX_NIGHT],['已度过',S.stats?S.stats.nights:0],['最佳纪录',save.best.nights+' 夜'],
     ['累计启航',save.best.wins+' 次']],rel:['boss','ember','tide']},
  {id:'ember',cat:'term',name:'文明火种',icon:'ember',color:'#ff8a3d',
   desc:'局外货币，失败也结算，用于购买永久传承。',
   stats:()=>[['当前库存',save.embers],['公式','夜数×3 + 击杀÷8'],['胜利额外','+12'],['难度系数',DIFFS[save.diff].ember+'×']],
   rel:['l_blade','l_iron','l_stock']},
  {id:'dash',cat:'term',name:'冲刺',icon:'bolt',color:'#57e6ff',
   desc:'空格短距疾冲，3.4 倍速并附带无敌帧。',
   stats:()=>[['冷却',P.dashCdMax.toFixed(2)+' 秒'],['持续','0.16 秒'],['无敌','0.28 秒'],['倍率','3.4×']],
   rel:['keeper','b_shadow']},
  {id:'nova',cat:'term',name:'雾爆',icon:'burst',color:'#57e6ff',
   desc:'Q 释放的自身范围新星，消耗 60 雾能，与卡牌系统互不干扰。',
   stats:()=>[['雾能消耗','60'],['伤害',(30*P.novaMult).toFixed(1)],
     ['半径',(3.1*(1+.12*(P.stacks.nova||0))).toFixed(2)+' 格'],['雾能回复',(14*P.regen).toFixed(1)+' /秒']],
   rel:['keeper','b_nova','c_surge']},
  {id:'downed',cat:'term',name:'灯芯熄灭',icon:'skull',color:'#ff4d6d',
   desc:'生命归零后 3 秒于核心重燃，恢复六成生命并损失两成雾晶。',
   stats:()=>[['重燃时间','3 秒'],['重燃生命','60%'],['雾晶损失','20%'],['重燃无敌','2 秒']],
   rel:['keeper','core','crys']}
];
const CX_BY_ID={};CODEX.forEach(e=>CX_BY_ID[e.id]=e);
let cxCat='all',cxQuery='',cxFiltered=[],cxSel=null,cxT=0;
const cxCv=$('cxPreview'),cxCtx=cxCv.getContext('2d');
let cxW=168,cxH=168;
function sizeCodexCv(){
  const r=cxCv.getBoundingClientRect();
  cxW=Math.max(60,r.width||168);cxH=Math.max(60,r.height||168);
  cxCv.width=Math.floor(cxW*DPR);cxCv.height=Math.floor(cxH*DPR);
}
function cxSeenCount(){
  let n=0;
  for(const k of ['foe','card','play'])for(const id in save.seen[k])if(save.seen[k][id]>0)n++;
  return n;
}
function cxBuildCats(){
  const wrap=$('cxCats');
  wrap.innerHTML=CX_CATS.map(c=>{
    const n=c.id==='all'?CODEX.length:CODEX.filter(e=>e.cat===c.id).length;
    return `<button class="cxCat${c.id===cxCat?' on':''}" data-c="${c.id}">${c.name}<i>${n}</i></button>`;
  }).join('');
  wrap.querySelectorAll('.cxCat').forEach(el=>el.addEventListener('click',()=>{
    cxCat=el.dataset.c;sfx('page');cxBuildCats();cxRenderList();}));
}
function cxRenderList(){
  const q=cxQuery.trim().toLowerCase();
  cxFiltered=CODEX.filter(e=>{
    if(cxCat!=='all'&&e.cat!==cxCat)return false;
    if(!q)return true;
    return (e.name+' '+e.desc).toLowerCase().includes(q);
  });
  const list=$('cxList');
  if(!cxFiltered.length)list.innerHTML='<div class="cxEmpty">雾中没有这条记录<br>换个关键词试试</div>';
  else{
    list.innerHTML=cxFiltered.map(e=>{
      let bdg='';
      if(e.cat==='foe'&&save.seen.foe[e.id])bdg='×'+save.seen.foe[e.id];
      else if(e.cat==='card'){const id=e.id.slice(2);if(cardTotal(id))bdg='×'+cardTotal(id);}
      else if(e.cat==='bless'&&save.seen.card[e.id.slice(2)])bdg='×'+save.seen.card[e.id.slice(2)];
      const cn=(CX_CATS.find(c=>c.id===e.cat)||{}).name||'';
      return `<button class="cxItem${cxSel===e.id?' on':''}" data-id="${e.id}">
        <span class="ci" style="color:${e.color};background:${e.color}1a">${svg(e.icon,16)}</span>
        <span class="ct"><b>${e.name}</b><span>${cn}</span></span>${bdg?`<span class="bdg">${bdg}</span>`:''}</button>`;
    }).join('');
    list.querySelectorAll('.cxItem').forEach(el=>el.addEventListener('click',()=>cxSelect(el.dataset.id,true)));
  }
  if(!cxFiltered.some(e=>e.id===cxSel))cxSelect(cxFiltered.length?cxFiltered[0].id:null,false);
  else cxSelect(cxSel,false);
  const track=4+BLESSINGS.length+CIDS.length,got=cxSeenCount();
  $('cxCount').textContent=`共 ${CODEX.length} 条 · 显示 ${cxFiltered.length} 条 · 已记录 ${Math.min(got,track)}/${track}`;
  $('cxProgFill').style.width=clamp(got/track,0,1)*100+'%';
}
function cxSelect(id,scroll){
  cxSel=id;
  document.querySelectorAll('.cxItem').forEach(el=>el.classList.toggle('on',el.dataset.id===id));
  const e=id?CX_BY_ID[id]:null;
  if(!e){$('cxName').textContent='—';$('cxTags').innerHTML='';$('cxDesc').textContent='';
    $('cxStats').innerHTML='';$('cxRel').innerHTML='';cxCv.style.display='none';$('cxIcon').innerHTML='';return;}
  $('cxName').textContent=e.name;
  const cn=(CX_CATS.find(c=>c.id===e.cat)||{}).name||'';
  $('cxTags').innerHTML=`<span class="cxTag" style="color:${e.color};border-color:${e.color}66">${cn}</span>`+
    (e.sprite?'<span class="cxTag">实景模型</span>':'');
  $('cxDesc').textContent=e.desc;
  $('cxStats').innerHTML=e.stats().map(s=>`<div class="cxStat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');
  const rel=(e.rel||[]).filter(r=>CX_BY_ID[r]);
  $('cxRel').innerHTML=rel.length?rel.map(r=>{const t=CX_BY_ID[r];
    return `<button class="cxRelBtn" data-id="${r}">${svg(t.icon,14,t.color)}${t.name}</button>`;}).join('')
    :'<span style="font-size:12px;color:var(--dim2)">无</span>';
  $('cxRel').querySelectorAll('.cxRelBtn').forEach(el=>el.addEventListener('click',()=>{
    const t=CX_BY_ID[el.dataset.id];
    if(cxCat!=='all'&&t.cat!==cxCat){cxCat='all';cxBuildCats();}
    if(cxQuery){cxQuery='';$('cxSearch').value='';}
    cxRenderList();cxSelect(el.dataset.id,true);sfx('page');
  }));
  if(e.sprite){cxCv.style.display='block';$('cxIcon').innerHTML='';sizeCodexCv();}
  else{cxCv.style.display='none';
    $('cxIcon').innerHTML=`<div style="color:${e.color};filter:drop-shadow(0 0 18px ${e.color}88)">${svg(e.icon,72)}</div>`;}
  $('cxFootL').textContent=`雾海方舟 · ${cn} · ${e.name}`;
  if(scroll){const el=document.querySelector(`.cxItem[data-id="${id}"]`);if(el)el.scrollIntoView({block:'nearest'});sfx('page');}
}
function cxMove(d){
  if(!cxFiltered.length)return;
  let i=cxFiltered.findIndex(e=>e.id===cxSel);
  i=clamp(i+d,0,cxFiltered.length-1);cxSelect(cxFiltered[i].id,true);
}
function cxDrawPreview(dt){
  const e=cxSel?CX_BY_ID[cxSel]:null;
  if(!e||!e.sprite||cxCv.style.display==='none')return;
  if(!cxCv.width)sizeCodexCv();
  cxT+=dt;
  const main=ctx;
  try{
    ctx=cxCtx;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,cxW,cxH);
    const bg=ctx.createRadialGradient(cxW/2,cxH*.66,4,cxW/2,cxH*.66,cxW*.75);
    bg.addColorStop(0,'rgba(20,58,78,.85)');bg.addColorStop(1,'rgba(7,19,28,0)');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cxW,cxH);
    const sc=Math.min(cxW,cxH)/168;
    ctx.save();ctx.translate(cxW/2,cxH*.8);ctx.scale(sc,sc);
    ctx.fillStyle='#163c3a';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(46,7);ctx.lineTo(0,30);ctx.lineTo(-46,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0c2a30';
    ctx.beginPath();ctx.moveTo(-46,7);ctx.lineTo(0,30);ctx.lineTo(0,38);ctx.lineTo(-46,15);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(46,7);ctx.lineTo(0,30);ctx.lineTo(0,38);ctx.lineTo(46,15);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(143,227,208,.28)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(46,7);ctx.lineTo(0,30);ctx.lineTo(-46,7);ctx.closePath();ctx.stroke();
    const k=e.sprite;
    const gk=(k==='crys'||k==='cannon')?'cyan':k==='totem'?'leaf':
      (k==='crawler'||k==='spitter'||k==='brute'||k==='boss')?'violet':'amber';
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.45;
    ctx.drawImage(GLOW[gk],-72,-104,144,144);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    const t=cxT;
    if(k==='player')drawPlayer({x:0,y:0,downed:false,moving:false,anim:0,face:.6,ifr:0,swingT:0});
    else if(k==='core'){ctx.save();ctx.scale(.82,.82);drawCore({x:0,y:0,hp:1,max:1,flash:0});ctx.restore();}
    else if(k==='tree')drawTree({type:'tree',x:0,y:0,alive:true,shake:0,sway:0,s:1.15});
    else if(k==='rock')drawRock({type:'rock',x:0,y:0,alive:true,shake:0,sway:0,s:1.25});
    else if(k==='crys')drawCrys({type:'crys',x:0,y:0,alive:true,shake:0,sway:0,s:1.3});
    else if(BUILDS[k]){ctx.save();ctx.scale(1.25,1.25);
      drawBuild({type:k,x:0,y:0,hp:1,max:1,r:.4,flash:0,pulse:t,ang:Math.sin(t*.6)*.9});ctx.restore();}
    else if(FOES[k]){const s=k==='boss'?.82:k==='brute'?1.25:1.5;
      ctx.save();ctx.scale(s,s);
      drawFoe({type:k,x:0,y:0,r:FOES[k].r,hp:1,max:1,flash:0,anim:t*4,elite:false,boss:k==='boss',dead:false});ctx.restore();}
    ctx.restore();
  }catch(err){}finally{ctx=main;}
}
let cxOpener=null;
function openCodex(from){
  if(codexOpen)return;
  auInit();codexReturn=from;codexOpen=true;
  cxOpener=from==='menu'?$('btnCodexMenu'):$('btnCodexPause');
  persist();showOv(from==='menu'?'menu':'pauseOv',false);showOv('codexOv',true);
  cxBuildCats();cxRenderList();sizeCodexCv();sfx('page');
  if(!isTouch)setTimeout(()=>$('cxSearch').focus(),60);
}
function closeCodex(){
  if(!codexOpen)return;
  codexOpen=false;showOv('codexOv',false);
  showOv(codexReturn==='menu'?'menu':'pauseOv',true);sfx('ui');
  if(cxOpener&&!isTouch)cxOpener.focus();
}
$('cxClose').addEventListener('click',closeCodex);
$('codexOv').addEventListener('pointerdown',e=>{if(e.target.classList.contains('scrim'))closeCodex();});
$('cxSearch').addEventListener('input',e=>{cxQuery=e.target.value;cxRenderList();});
$('btnCodexMenu').addEventListener('click',()=>openCodex('menu'));
$('btnCodexPause').addEventListener('click',()=>openCodex('pause'));

/* ---------------- 流程 ---------------- */
function showOv(id,on){$(id).classList.toggle('show',on);}
function startRun(){
  auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  clearInterval(emberTimer);codexOpen=false;
  ['codexOv','menu','endOv','pauseOv','dawnOv','removeOv'].forEach(id=>showOv(id,false));
  initRun();S.mode='play';
  UI.hud.classList.remove('hidden');refreshStacks();
  banner('第 1 日','拖动卡牌到地面筑防','');sfx('dawn');
  requestAnimationFrame(layoutHand);
}
function pauseGame(){
  if(S.mode!=='play'||codexOpen)return;
  S.mode='pause';endDrag(true);persist();showOv('pauseOv',true);sfx('ui');
}
function resumeGame(){if(S.mode!=='pause')return;S.mode='play';showOv('pauseOv',false);sfx('ui');}
function toTitle(){
  S.mode='menu';codexOpen=false;
  ['pauseOv','endOv','dawnOv','removeOv','codexOv'].forEach(id=>showOv(id,false));
  UI.hud.classList.add('hidden');initRun();S.nightAmt=.55;refreshMenu();showOv('menu',true);auPhase(false);
}
function refreshMenu(){
  $('emberNum').textContent=save.embers;
  $('bestChip').textContent=save.best.nights>0?`${save.best.nights} 夜 · ${save.best.kills} 击杀`:'尚无记录';
  const dr=$('diffRow');
  if(!dr.children.length){
    dr.innerHTML=Object.entries(DIFFS).map(([k,d])=>`<button class="diffBtn" data-d="${k}">${d.name}<small>${d.sub}</small></button>`).join('');
    dr.querySelectorAll('.diffBtn').forEach(el=>el.addEventListener('click',()=>{
      save.diff=el.dataset.d;persist();refreshMenu();sfx('ui');}));
  }
  dr.querySelectorAll('.diffBtn').forEach(el=>el.classList.toggle('sel',el.dataset.d===save.diff));
  const bl=$('blessList');
  bl.innerHTML=Object.entries(BLESS).map(([k,b])=>{
    const lv=save.bless[k],maxed=lv>=b.max,cost=maxed?0:b.costs[lv];
    const pips=Array.from({length:b.max},(_,i)=>`<span class="pip${i<lv?' on':''}"></span>`).join('');
    return `<div class="blessRow">${svg(b.icon,21,b.color)}
      <div class="blessInfo"><b>${b.name} <span style="color:${b.color};font-size:11px">Lv.${lv}</span></b>
      <span>${b.desc}</span><div class="pips">${pips}</div></div>
      <button class="buyBtn" data-k="${k}" ${maxed||save.embers<cost?'disabled':''}>${maxed?'满':cost}</button></div>`;
  }).join('');
  bl.querySelectorAll('.buyBtn').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.k,b=BLESS[k],lv=save.bless[k];
    if(lv>=b.max||save.embers<b.costs[lv])return;
    save.embers-=b.costs[lv];save.bless[k]++;persist();sfx('level');refreshMenu();
  }));
}

/* ---------------- 主循环 ---------------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,1/30);lastT=now;
  if(codexOpen){S.elapsed+=dt*.35;render();cxDrawPreview(dt);return;}
  if(S.mode==='menu'){
    S.elapsed+=dt;
    const a=S.elapsed*.12;
    cam.x=CEN+Math.cos(a)*5;cam.y=CEN+Math.sin(a)*5;cam.z=lerp(cam.z,1.15,dt*2);
    P.x=CEN+2.2;P.y=CEN+.5;P.face=a+Math.PI;
    updateParts(dt);
    if(Math.random()<dt*3)puff(CEN+rand(-6,6),CEN+rand(-6,6),1,'#ffd9a0',.3,1.6,1.8,-20);
    core.beam=.6;
  }else if(S.mode==='play'){
    updateMouseWorld();
    let wdt=dt*S.speed;
    if(S.hitstop>0){S.hitstop-=dt;wdt=0;}
    if(wdt>0)update(wdt);
    if(S.handDirty)renderHand();
  }else if(S.mode==='launch'){
    S.launchT+=dt;S.elapsed+=dt;updateParts(dt);
    core.beam=1;cam.shake=Math.max(0,cam.shake-dt*30);
    cam.sx=rand(-1,1)*cam.shake;cam.sy=rand(-1,1)*cam.shake;
    cam.x=lerp(cam.x,core.x,dt*1.5);cam.y=lerp(cam.y,core.y,dt*1.5);
    if(Math.random()<dt*30)puff(core.x+rand(-1,1),core.y+rand(-1,1),1,'#ffe0a8',1,1.4,2.5,-60);
    if(S.launchT>=2.8)showEnd(true);
  }else if(S.mode==='over'){
    S.elapsed+=dt;updateParts(dt);
    cam.shake=Math.max(0,cam.shake-dt*30);
    cam.sx=rand(-1,1)*cam.shake;cam.sy=rand(-1,1)*cam.shake;
    S.overT-=dt;if(S.overT<=0)showEnd(false);
  }else{
    S.elapsed+=dt*.3;updateParts(dt*.3);
    if(S.handDirty)renderHand();
  }
  render();syncHUD();
}

/* ---------------- 启动 ---------------- */
cacheUI();resize();setMuted(save.muted);
$('btnSpeed').textContent='1×';
$('btnPause').addEventListener('click',()=>{auInit();S.mode==='play'?pauseGame():(S.mode==='pause'&&!codexOpen&&resumeGame());});
$('btnMute').addEventListener('click',()=>{auInit();setMuted(!save.muted);sfx('ui');});
$('btnSpeed').addEventListener('click',()=>{
  auInit();S.speed=S.speed===1?2:1;
  $('btnSpeed').textContent=S.speed+'×';$('btnSpeed').classList.toggle('warnState',S.speed===2);sfx('ui');});
$('btnResume').addEventListener('click',resumeGame);
$('btnRestart').addEventListener('click',()=>{showOv('pauseOv',false);startRun();});
$('btnToTitle').addEventListener('click',toTitle);
$('btnAgain').addEventListener('click',()=>{clearInterval(emberTimer);startRun();});
$('btnTitle2').addEventListener('click',()=>{clearInterval(emberTimer);toTitle();});
$('startBtn').addEventListener('click',startRun);
$('repairBtn').addEventListener('click',tryRepair);
initRun();S.nightAmt=.55;refreshMenu();refreshStacks();
requestAnimationFrame(loop);
